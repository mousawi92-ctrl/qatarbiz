/* ================= DESIGN TOKENS =================
   Navy ink:    #8A1538   Deep ink: #6E102C
   Paper:       #FFFFFF   Section:  #F7F4EE
   Brass gold:  #C6A664   Teal:     #1F7A5C
   Border:      #E9E2D6   Muted:    #6B6257
   Display: Fraunces / Body: Public Sans / Data: IBM Plex Mono
==================================================== */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Tajawal:wght@400;500;700;800&display=swap');

:root{
  --ink:#8A1538; --deep:#6E102C; --paper:#FFFFFF; --section:#F7F4EE;
  --gold:#C6A664; --gold-soft:#F5EAD3; --teal:#1F7A5C; --teal-soft:#E7F2ED;
  --border:#E9E2D6; --muted:#6B6257; --danger:#B4443C;
  --disp:'Fraunces', Georgia, serif;
  --body:'Public Sans', -apple-system, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{transition:none!important; animation:none!important;} }
body{font-family:var(--body); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;}
button{font-family:var(--body); cursor:pointer;}
input,select,textarea{font-family:var(--body); font-size:15px; color:var(--ink);}
a{color:inherit; text-decoration:none;}

.wrap{max-width:1120px; margin:0 auto; padding:0 20px;}
.disp{font-family:var(--disp);}
.mono{font-family:var(--mono);}
.muted{color:var(--muted);}
.section{padding:72px 0;}
.section.grey{background:var(--section);}
.section.navy{background:var(--deep); color:#EAF0F8;}

.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--gold); margin-bottom:12px;}
.h1{font-family:var(--disp); font-weight:500; font-size:clamp(34px,5vw,54px); line-height:1.08; letter-spacing:-.01em;}
.h2{font-family:var(--disp); font-weight:500; font-size:clamp(26px,3.4vw,36px); line-height:1.15;}
.h3{font-family:var(--disp); font-weight:500; font-size:21px; line-height:1.25;}
.lead{font-size:17px; line-height:1.65; color:var(--muted); max-width:60ch;}

.btn{display:inline-flex; align-items:center; gap:8px; border-radius:10px; font-weight:600; font-size:15px; padding:13px 22px; border:1.5px solid transparent; transition:background .15s, color .15s, border-color .15s;}
.btn.primary{background:var(--ink); color:#fff;}
.btn.primary:hover{background:var(--deep);}
.btn.gold{background:var(--gold); color:#fff;}
.btn.gold:hover{background:#A57F3C;}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--ink);}
.btn.ghost:hover{background:var(--ink); color:#fff;}
.btn.light{background:#fff; color:var(--ink); border-color:var(--border);}
.btn.light:hover{border-color:var(--ink);}
.btn.sm{padding:9px 16px; font-size:14px; border-radius:8px;}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:3px solid rgba(184,146,74,.55); outline-offset:2px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

.card{background:#fff; border:1px solid var(--border); border-radius:16px;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px; white-space:nowrap;}
.badge.teal{background:var(--teal-soft); color:var(--teal);}
.badge.gold{background:var(--gold-soft); color:#8F7333;}
.badge.navy{background:#E8EDF5; color:var(--ink);}
.badge.grey{background:#F3EEE4; color:var(--muted);}

/* Signature: the identity veil */
.veil{position:relative; overflow:hidden; border-radius:8px; background:repeating-linear-gradient(-45deg,#A31B45,#A31B45 6px,#8A1538 6px,#8A1538 12px); color:#B9C6D9; display:flex; align-items:center; gap:8px; padding:9px 13px; font-size:12.5px; font-weight:600; letter-spacing:.03em;}
.veil .lockicon{color:var(--gold);}

/* Header */
.hdr{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.hdr-in{display:flex; align-items:center; justify-content:space-between; height:68px;}
.logow{font-family:var(--serif),Georgia,serif;font-weight:700;font-size:21px;letter-spacing:.01em}
.logo{display:flex; align-items:baseline; gap:2px; font-family:var(--disp); font-size:23px; font-weight:600; letter-spacing:-.01em;}
.logo .qa{color:var(--gold); font-size:15px; font-family:var(--mono); font-weight:500;}
.nav-links{display:flex; align-items:center; gap:26px; font-size:14.5px; font-weight:500;}
.nav-links button{background:none; border:none; font-size:14.5px; font-weight:500; color:var(--ink); padding:4px 0;}
.nav-links button:hover{color:var(--gold);}
.nav-links button.active{color:var(--gold);}
.burger{display:none; background:none; border:none; color:var(--ink);}
.mobile-nav{display:none;}
@media(max-width:960px){
  .nav-links{display:none;}
  .burger{display:block;}
  .mobile-nav.open{display:block; background:#fff; border-bottom:1px solid var(--border); padding:12px 20px 20px;}
  .mobile-nav button{display:block; width:100%; text-align:left; background:none; border:none; padding:12px 4px; font-size:16px; font-weight:500; color:var(--ink); border-bottom:1px solid var(--section);}
}

/* Hero */
.hero{padding:84px 0 76px; background:linear-gradient(180deg,#FFFFFF 0%, #FAF8F4 100%);}
.hero-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:center;}
@media(max-width:880px){.hero-grid{grid-template-columns:1fr;} .hero-art{max-width:420px; margin:0 auto;}}

/* Grids */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:24px;}
@media(max-width:920px){.grid4{grid-template-columns:repeat(2,1fr);} .grid3{grid-template-columns:1fr;}}
@media(max-width:640px){.grid2,.grid4{grid-template-columns:1fr;}}

/* Listing cards */
.lcard{background:#fff; border:1px solid var(--border); border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:14px; transition:border-color .15s, box-shadow .15s;}
.lcard:hover{border-color:#C7D2E0; box-shadow:0 8px 28px rgba(138,21,56,.07);}
.ref{font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.02em;}
.price{font-family:var(--disp); font-size:24px; font-weight:600;}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:7px 0; border-bottom:1px dashed var(--border);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:600; text-align:right;}

/* Forms */
.field{margin-bottom:18px;}
.field label{display:block; font-size:13.5px; font-weight:600; margin-bottom:7px;}
.field .hint{font-size:12.5px; color:var(--muted); margin-top:5px;}
.input, select.input, textarea.input{width:100%; border:1.5px solid var(--border); border-radius:10px; padding:12px 14px; background:#fff;}
.input:focus{border-color:var(--ink); outline:none;}
textarea.input{min-height:96px; resize:vertical;}
.seg{display:flex; flex-wrap:wrap; gap:8px;}
.seg button{border:1.5px solid var(--border); background:#fff; border-radius:9px; padding:9px 16px; font-size:14px; font-weight:500; color:var(--ink);}
.seg button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
.checkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px;}
.checkgrid label{display:flex; align-items:center; gap:8px; border:1.5px solid var(--border); border-radius:9px; padding:10px 12px; font-size:13.5px; font-weight:500; cursor:pointer; background:#fff;}
.checkgrid label.on{border-color:var(--teal); background:var(--teal-soft);}
.priv{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--teal); font-weight:600; background:var(--teal-soft); padding:3px 9px; border-radius:999px;}

/* Wizard */
.steps{display:flex; gap:6px; margin-bottom:28px; flex-wrap:wrap;}
.stepdot{height:6px; flex:1; min-width:24px; border-radius:99px; background:var(--border);}
.stepdot.done{background:var(--teal);}
.stepdot.now{background:var(--gold);}
.wizhead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
.stepcount{font-family:var(--mono); font-size:12.5px; color:var(--muted);}

/* Upload */
.drop{border:2px dashed #C9D3E0; border-radius:14px; padding:34px 20px; text-align:center; background:#FBFAF7; cursor:pointer;}
.drop:hover{border-color:var(--gold);}

/* Tables (admin) */
.tbl{width:100%; border-collapse:collapse; font-size:13.5px;}
.tbl th{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-weight:700;}
.tbl td{padding:12px; border-bottom:1px solid var(--section); vertical-align:middle;}
.tbl tr:hover td{background:#FBFAF7;}
.tblwrap{overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:#fff;}

/* Dashboard shell */
.dash{display:grid; grid-template-columns:230px 1fr; gap:0; min-height:70vh;}
.dashnav{background:var(--deep); color:#E4D9C8; padding:26px 0; border-radius:16px 0 0 16px;}
.dashnav button{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none; color:#E4D9C8; padding:12px 22px; font-size:14px; font-weight:500;}
.dashnav button:hover{color:#fff;}
.dashnav button.active{color:#fff; background:rgba(255,255,255,.07); border-right:3px solid var(--gold);}
.dashbody{background:#fff; border:1px solid var(--border); border-left:none; border-radius:0 16px 16px 0; padding:30px;}
@media(max-width:840px){ .dash{grid-template-columns:1fr;} .dashnav{border-radius:16px 16px 0 0; display:flex; overflow-x:auto; padding:8px;} .dashnav button{width:auto; white-space:nowrap; padding:10px 14px;} .dashnav button.active{border-right:none; border-bottom:3px solid var(--gold);} .dashbody{border-left:1px solid var(--border); border-radius:0 0 16px 16px; padding:20px;} }
.stat{background:#fff; border:1px solid var(--border); border-radius:14px; padding:18px;}
.stat .n{font-family:var(--disp); font-size:28px; font-weight:600;}
.stat .l{font-size:12.5px; color:var(--muted); font-weight:600; margin-top:2px;}

/* Modal */
.modal-bg{position:fixed; inset:0; background:rgba(110,16,44,.55); z-index:80; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;}
.modal{background:#fff; border-radius:18px; max-width:640px; width:100%; padding:30px; position:relative;}
.modal .close{position:absolute; top:16px; right:16px; background:none; border:none; color:var(--muted);}

/* Footer */
.foot{background:var(--deep); color:#D9CBB6; padding:56px 0 30px; font-size:14px;}
.foot h4{color:#fff; font-size:13px; text-transform:uppercase; letter-spacing:.1em; margin-bottom:14px;}
.foot button{display:block; background:none; border:none; color:#D9CBB6; padding:5px 0; font-size:14px; text-align:left;}
.foot button:hover{color:#fff;}
